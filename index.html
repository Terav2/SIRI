<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Siri AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#0A84FF;--purple:#BF5AF2;--pink:#FF375F;--green:#30D158;
  --orange:#FF9F0A;--teal:#64D2FF;--yellow:#FFD60A;
  --glass:rgba(255,255,255,0.055);--glass2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.09);
  --t1:#F5F5F7;--t2:rgba(245,245,247,0.65);--t3:rgba(245,245,247,0.38);
  --bg:#000;--elevated:#1C1C1E;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;position:relative}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient .g{position:absolute;border-radius:50%;filter:blur(120px);opacity:.18;animation:drift 25s ease-in-out infinite}
.ambient .g1{width:500px;height:500px;background:var(--purple);top:-200px;left:50%;transform:translateX(-50%)}
.ambient .g2{width:400px;height:400px;background:var(--blue);bottom:-150px;left:-100px;animation-delay:-10s}
.ambient .g3{width:350px;height:350px;background:var(--pink);bottom:-100px;right:-100px;animation-delay:-18s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.1)}66%{transform:translate(-30px,40px) scale(.9)}}

/* Header = Dynamic Island */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:relative;z-index:20;transition:all .4s cubic-bezier(.4,0,.2,1)}
.header-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
/* Header orb (in header, expands on listen) */
.header-orb-wrap{position:relative;width:36px;height:36px;flex-shrink:0;transition:all .4s cubic-bezier(.4,0,.2,1)}
.header-orb-wrap canvas{width:100%;height:100%;border-radius:50%;filter:drop-shadow(0 0 8px rgba(191,90,242,.4)) drop-shadow(0 0 16px rgba(10,132,255,.2));transition:all .4s cubic-bezier(.4,0,.2,1)}
.header-orb-wrap.expanded{width:180px;height:40px}
.header-orb-wrap.expanded canvas{border-radius:20px;filter:drop-shadow(0 0 14px rgba(191,90,242,.5)) drop-shadow(0 0 28px rgba(10,132,255,.25))}
/* Liquid text */
.header-title-wrap{display:flex;flex-direction:column;min-width:0;transition:opacity .3s}
.header-title{font-size:17px;font-weight:800;letter-spacing:-.4px;background:linear-gradient(135deg,rgba(245,245,247,.95) 0%,rgba(191,90,242,.8) 25%,rgba(100,210,255,.9) 50%,rgba(255,55,95,.7) 75%,rgba(245,245,247,.95) 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:liquid-text 8s ease-in-out infinite;line-height:1.2}
@keyframes liquid-text{0%,100%{background-position:0% 50%}25%{background-position:50% 0%}50%{background-position:100% 50%}75%{background-position:50% 100%}}
.header-sub{font-size:10px;color:var(--t3);font-weight:500;letter-spacing:.3px;transition:opacity .3s}
.header-orb-wrap.expanded~.header-title-wrap{opacity:0;width:0;overflow:hidden}
/* Transcript in header */
.header-transcript{font-size:13px;color:var(--t2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin-left:10px;opacity:0;transition:opacity .3s;min-width:0}
.header-transcript.show{opacity:1}
.header-right{display:flex;gap:6px}
.header-right button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);color:rgba(245,245,247,.5);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.header-right button:hover{background:rgba(255,255,255,.08);color:var(--t1);border-color:rgba(191,90,242,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 12px rgba(191,90,242,.1)}
.header-right button svg{opacity:.7;transition:opacity .3s}
.header-right button:hover svg{opacity:1}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:0 20px 20px;position:relative;z-index:5;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:3px}.chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:9px}

/* Welcome text */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:14px;padding:30px 20px}
.welcome h1{font-size:28px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,rgba(245,245,247,.95) 0%,rgba(191,90,242,.8) 25%,rgba(100,210,255,.9) 50%,rgba(255,55,95,.7) 75%,rgba(245,245,247,.95) 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:liquid-text 8s ease-in-out infinite}
.welcome p{font-size:14px;color:var(--t2);max-width:380px;line-height:1.5}

/* Listening indicator in chat */
.listening-indicator{display:flex;align-items:center;gap:12px;padding:16px 0;animation:msgIn .3s}
.listening-orb{width:40px;height:40px;border-radius:50%;position:relative;flex-shrink:0}
.listening-orb canvas{border-radius:50%;filter:drop-shadow(0 0 15px rgba(191,90,242,.5))}
.listening-text{font-size:14px;color:var(--t2);font-weight:500}
.listening-bars{display:flex;gap:3px;align-items:center;height:20px;margin-left:auto}
.listening-bars span{width:3px;border-radius:3px;background:linear-gradient(to top,var(--blue),var(--purple));animation:lbar .6s ease-in-out infinite alternate}
.listening-bars span:nth-child(1){animation-delay:0s;height:8px}
.listening-bars span:nth-child(2){animation-delay:.1s;height:14px}
.listening-bars span:nth-child(3){animation-delay:.2s;height:10px}
.listening-bars span:nth-child(4){animation-delay:.15s;height:16px}
.listening-bars span:nth-child(5){animation-delay:.05s;height:12px}
@keyframes lbar{from{height:4px}to{height:20px}}

/* Messages */
.msg{margin-bottom:14px;animation:msgIn .4s cubic-bezier(.4,0,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg-av{width:26px;height:26px;border-radius:50%;flex-shrink:0;overflow:hidden;position:relative}
.msg-av.siri{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 10px rgba(191,90,242,.15);display:flex;align-items:center;justify-content:center;overflow:hidden}
.msg-av.siri::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(100,210,255,.4),rgba(191,90,242,.3) 35%,rgba(255,55,95,.2) 65%,rgba(10,132,255,.15));animation:av-glow 4s ease-in-out infinite}
@keyframes av-glow{0%,100%{opacity:.7}50%{opacity:1}}
.msg-av.siri svg{position:relative;z-index:1;opacity:.8;filter:drop-shadow(0 0 2px rgba(255,255,255,.3))}
.msg-av.user{background:rgba(10,132,255,.06);border:1px solid rgba(10,132,255,.12);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.msg-av.user svg{opacity:.7;filter:drop-shadow(0 0 2px rgba(10,132,255,.3))}
.msg-name{font-size:12px;font-weight:600;color:var(--t2)}
.msg-time{font-size:10px;color:var(--t3)}
.msg-bubble{padding:13px 17px;border-radius:20px;font-size:14px;line-height:1.65;max-width:90%;word-wrap:break-word}
.msg.user .msg-bubble{background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.08);margin-left:auto;border-bottom-right-radius:5px}
.msg.siri .msg-bubble{background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border-bottom-left-radius:5px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.msg-bubble p{margin-bottom:6px}.msg-bubble p:last-child{margin-bottom:0}
.msg-bubble code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;font-size:12px;font-family:'SF Mono',monospace}
.msg-bubble pre{background:rgba(0,0,0,.35);padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:12px}
.msg-bubble pre code{background:none;padding:0}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin:6px 0}.msg-bubble li{margin-bottom:3px}
.msg-bubble strong{font-weight:600;color:#fff}
.msg-bubble a{color:var(--blue);text-decoration:none}
.msg-actions{display:flex;gap:5px;margin-top:6px}
.msg-actions button{font-size:11px;padding:4px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);color:rgba(245,245,247,.4);cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.msg-actions button:hover{color:var(--t1);background:rgba(255,255,255,.07);border-color:rgba(191,90,242,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 8px rgba(191,90,242,.08)}
.msg-actions button svg{opacity:.5;transition:opacity .3s}
.msg-actions button:hover svg{opacity:1}

/* Typing */
.typing{display:flex;gap:4px;padding:13px 17px;border-radius:20px;background:var(--glass);border:1px solid var(--border);width:fit-content;border-bottom-left-radius:5px}
.typing span{width:6px;height:6px;border-radius:50%;animation:bounce 1.4s ease-in-out infinite}
.typing span:nth-child(1){background:var(--purple)}.typing span:nth-child(2){background:var(--blue);animation-delay:.2s}.typing span:nth-child(3){background:var(--pink);animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* Widgets */
.widget{margin-top:10px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--border);overflow:hidden;max-width:360px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 4px 20px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.04)}
.widget-head{display:flex;align-items:center;gap:7px;padding:9px 13px;background:rgba(255,255,255,.03);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;font-weight:600;color:var(--t2)}
.widget-head svg{opacity:.5}
.widget-body{padding:14px}
.wt-circle{width:140px;height:140px;position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto}
.wt-circle svg{position:absolute;inset:0;transform:rotate(-90deg)}
.wt-time{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;z-index:1}
.wt-label{text-align:center;font-size:12px;color:var(--t2);margin-top:6px}
.wt-btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.wt-btns button{padding:7px 18px;border-radius:18px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:5px}
.wt-pause{background:var(--orange);color:#fff}.wt-pause:hover{opacity:.85}
.wt-stop{background:rgba(255,55,95,.12);color:var(--pink);border:1px solid rgba(255,55,95,.15)!important}.wt-stop:hover{background:rgba(255,55,95,.2)}
.wt-done{color:var(--green);font-size:18px;font-weight:700;text-align:center;margin-top:8px}
.note-c{background:rgba(255,215,10,.05);border:1px solid rgba(255,215,10,.1);border-radius:12px;padding:11px;margin-bottom:6px}
.note-t{font-size:13px;font-weight:600;color:var(--yellow);margin-bottom:3px}
.note-p{font-size:12px;color:var(--t2);line-height:1.4;white-space:pre-wrap}
.rem-c{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--glass);border:1px solid var(--border);border-radius:12px;margin-bottom:5px}
.rem-chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .2s;flex-shrink:0}
.rem-chk.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.rem-txt{font-size:13px;flex:1}
.sound-p{display:flex;align-items:center;gap:11px}
.sound-ic{font-size:28px;animation:sp 2s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.06);opacity:1}}
.sound-n{font-size:13px;font-weight:600}.sound-s{font-size:10px;color:var(--green)}
.sound-stop{padding:7px 16px;border-radius:16px;border:none;background:var(--pink);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.weather-c{text-align:center}.weather-ic{font-size:44px}.weather-tmp{font-size:34px;font-weight:800}.weather-city{font-size:13px;color:var(--t2)}.weather-dsc{font-size:11px;color:var(--t3);text-transform:capitalize}

/* History panel */
.history-panel{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:100;display:none;flex-direction:column;padding:20px}
.history-panel.on{display:flex}
.history-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.history-header h2{font-size:18px;font-weight:600}
.history-close{padding:8px 18px;border-radius:16px;border:1px solid var(--border);background:var(--glass);color:var(--t1);font-size:13px;cursor:pointer;font-family:inherit}
.history-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.history-item{padding:14px;border-radius:14px;background:var(--glass);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.history-item:hover{background:var(--glass2);border-color:rgba(191,90,242,.2)}
.history-item .hi-preview{font-size:13px;color:var(--t1);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .hi-time{font-size:11px;color:var(--t3)}
.history-empty{text-align:center;color:var(--t3);padding:40px;font-size:14px}

/* Input */
.input-area{padding:10px 16px 22px;position:relative;z-index:10}
.input-wrap{display:flex;align-items:flex-end;gap:6px;background:var(--glass2);border:1px solid var(--border);border-radius:26px;padding:4px 4px 4px 16px;transition:all .3s;backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);box-shadow:0 2px 16px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.04)}
.input-wrap:focus-within{border-color:rgba(191,90,242,.3);box-shadow:0 2px 16px rgba(0,0,0,.1),0 0 0 3px rgba(191,90,242,.06)}
.input-wrap textarea{flex:1;border:none;background:transparent;color:var(--t1);font-size:15px;font-family:inherit;resize:none;outline:none;max-height:120px;min-height:22px;line-height:1.5;padding:9px 0}
.input-wrap textarea::placeholder{color:var(--t3)}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;flex-shrink:0;font-size:16px;background:rgba(255,255,255,.03);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);color:rgba(245,245,247,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ib:hover{color:var(--t1);background:rgba(255,255,255,.07);border-color:rgba(191,90,242,.15)}
.ib svg{opacity:.6;transition:opacity .3s}
.ib:hover svg{opacity:1}
.ib.rec{background:var(--pink);color:#fff;animation:prec 1.5s infinite}
@keyframes prec{0%,100%{box-shadow:0 0 0 0 rgba(255,55,95,.4)}50%{box-shadow:0 0 0 10px rgba(255,55,95,0)}}
.send{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)!important;backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);color:rgba(245,245,247,.3);opacity:1;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.send svg{opacity:.4;transition:all .3s}
.send.on{background:linear-gradient(135deg,rgba(10,132,255,.25),rgba(191,90,242,.25));border-color:rgba(191,90,242,.3)!important;pointer-events:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 16px rgba(191,90,242,.15)}
.send.on svg{opacity:1}
.send.on:hover{transform:scale(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 24px rgba(191,90,242,.25)}
.send.on:active{transform:scale(.95)}
.foot{text-align:center;font-size:10px;color:var(--t3);margin-top:6px}

/* Voice overlay */
.voverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:24px}
.voverlay.on{display:flex}
.vviz{display:flex;align-items:center;gap:4px;height:60px}
.vbar{width:4px;height:14px;border-radius:4px;background:linear-gradient(to top,var(--blue),var(--purple));animation:vw .8s ease-in-out infinite alternate}
.vbar:nth-child(1){animation-delay:0s}.vbar:nth-child(2){animation-delay:.1s}.vbar:nth-child(3){animation-delay:.2s}.vbar:nth-child(4){animation-delay:.3s}.vbar:nth-child(5){animation-delay:.4s}.vbar:nth-child(6){animation-delay:.3s}.vbar:nth-child(7){animation-delay:.2s}.vbar:nth-child(8){animation-delay:.1s}.vbar:nth-child(9){animation-delay:0s}
@keyframes vw{from{height:8px}to{height:50px}}
.voverlay h2{font-size:18px;font-weight:500}
.voverlay p{font-size:13px;color:var(--t2)}
.vcancel{padding:11px 28px;border-radius:22px;border:1px solid var(--border);background:var(--glass);color:var(--t1);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}

@media(max-width:480px){.msg-bubble{max-width:95%}.welcome h1{font-size:22px}}
</style>
</head>
<body>
<div class="ambient"><div class="g g1"></div><div class="g g2"></div><div class="g g3"></div></div>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="header-orb-wrap" id="headerOrbWrap"><canvas id="headerOrb" width="72" height="72"></canvas></div>
      <div class="header-title-wrap" id="headerTitleWrap">
        <span class="header-title">Siri AI</span>
        <span class="header-sub">APPLE INTELLIGENCE</span>
      </div>
      <span class="header-transcript" id="headerTranscript"></span>
    </div>
    <div class="header-right">
      <button onclick="showHistory()" title="History"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
      <button onclick="clearChat()" title="New chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <div class="chat" id="chat">
    <!-- Welcome text (hidden after first message) -->
    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>Ask me anything. I can set timers, take notes, play sounds, do calculations, check weather, and much more.</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="inp" placeholder="Message Siri AI..." rows="1" autocomplete="off"></textarea>
      <button class="ib" id="voiceBtn" title="Voice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
      <button class="ib send" id="sendBtn" title="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
    <div class="foot">Siri AI can make mistakes. Verify important information.</div>
  </div>
</div>

<!-- Listening indicator (hidden by default) -->
<template id="listeningTpl">
  <div class="listening-indicator" id="listeningInd">
    <div class="listening-orb"><canvas id="listenOrbCanvas" width="40" height="40"></canvas></div>
    <div class="listening-text">Listening...</div>
    <div class="listening-bars"><span></span><span></span><span></span><span></span><span></span></div>

<script>
const S={msgs:[],busy:false,rec:false,sr:null,timers:[],notes:[],rems:[],pomo:null,sw:null,actx:null,snode:null,csound:null,orbState:'idle',analyser:null,dataArray:null,micStream:null,history:[]};
try{
  S.notes=JSON.parse(localStorage.getItem('siri_notes')||'[]');
  S.rems=JSON.parse(localStorage.getItem('siri_reminders')||'[]');
  S.history=JSON.parse(localStorage.getItem('siri_history')||'[]');
}catch(e){}

const $=id=>document.getElementById(id);
const chat=$('chat'),welcome=$('welcome'),inp=$('inp'),sendBtn=$('sendBtn'),voiceBtn=$('voiceBtn');
const voverlay=$('voverlay'),vtrans=$('vtrans');

// ===== HEADER ORB ANIMATION (Dynamic Island in header) =====
function animateHeaderOrb(){
  const canvas=$('headerOrb');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
  let t=0;let audioLevel=0;

  function drawPill(x,y,w,h,r){
    r=Math.min(r,h/2,w/2);
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.arc(x+w-r,y+r,r,-Math.PI/2,Math.PI/2);ctx.lineTo(x+r,y+h);
    ctx.arc(x+r,y+r,r,Math.PI/2,-Math.PI/2);ctx.closePath();
  }

  function draw(){
    t+=0.02;
    ctx.clearRect(0,0,W,H);

    // Audio reactivity
    if(S.analyser&&S.dataArray&&S.orbState==='listening'){
      S.analyser.getByteFrequencyData(S.dataArray);
      audioLevel+=(S.dataArray.reduce((a,b)=>a+b,0)/S.dataArray.length/255-audioLevel)*0.3;
    }else{audioLevel*=0.92;}

    const isActive=S.orbState==='listening'||S.orbState==='thinking';
    const energy=isActive?1+audioLevel*0.5:0.6;
    const r=W/2-6;

    // Glow
    const g0=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r+12);
    g0.addColorStop(0,`rgba(191,90,242,${0.3*energy})`);
    g0.addColorStop(0.5,`rgba(10,132,255,${0.15*energy})`);
    g0.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g0;ctx.fillRect(0,0,W,H);

    // Colors
    const h1=(Math.sin(t*0.25)*35+195);
    const h2=(Math.sin(t*0.4+1.2)*45+275);
    const h3=(Math.sin(t*0.35+2.4)*35+335);

    // Main sphere
    const grd=ctx.createRadialGradient(cx-r*0.3,cy-r*0.35,r*0.05,cx,cy,r);
    grd.addColorStop(0,`hsla(${h1},92%,80%,0.97)`);
    grd.addColorStop(0.3,`hsla(${h2},85%,65%,0.92)`);
    grd.addColorStop(0.6,`hsla(${h3},80%,55%,0.85)`);
    grd.addColorStop(1,`hsla(210,80%,35%,0.55)`);
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();

    // Liquid blobs
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    for(let i=0;i<6;i++){
      const a=t*0.5+i*Math.PI*2/6;
      const d=r*0.35+Math.sin(t*1.2+i*0.8)*r*0.1;
      const bx=cx+Math.cos(a)*d;const by=cy+Math.sin(a*1.3)*r*0.3;
      const br=r*0.45+Math.sin(t*2+i)*4;
      const bg=ctx.createRadialGradient(bx,by,0,bx,by,br);
      const bh=(h1+i*40+t*12)%360;
      bg.addColorStop(0,`hsla(${bh},90%,70%,${0.4*energy})`);
      bg.addColorStop(1,`hsla(${bh},90%,70%,0)`);
      ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
    }
    // Highlight
    const hl=ctx.createRadialGradient(cx-r*0.25,cy-r*0.35,0,cx-r*0.15,cy-r*0.2,r*0.5);
    hl.addColorStop(0,'rgba(255,255,255,0.4)');
    hl.addColorStop(0.4,'rgba(255,255,255,0.08)');
    hl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();
    ctx.restore();

    // Edge
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(191,90,242,${0.12+Math.sin(t*1.5)*0.05})`;
    ctx.lineWidth=1;ctx.stroke();

    // Listening ripples
    if(S.orbState==='listening'){
      for(let i=0;i<2;i++){
        const phase=(t*2+i*0.8)%2.5;const expand=phase/2.5;
        const rr=r+expand*12+audioLevel*8;
        ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);
        ctx.strokeStyle=`rgba(191,90,242,${(1-expand)*0.25})`;ctx.lineWidth=1.5;ctx.stroke();
      }
    }
    // Thinking pulse
    if(S.orbState==='thinking'){
      const pa=0.1+Math.sin(t*4)*0.07;
      ctx.beginPath();ctx.arc(cx,cy,r+3+Math.sin(t*3)*2,0,Math.PI*2);
      ctx.strokeStyle=`rgba(10,132,255,${pa})`;ctx.lineWidth=1.5;ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();
}
animateHeaderOrb();

// ===== INPUT =====
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';updateSend()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
sendBtn.addEventListener('click',send);
function updateSend(){sendBtn.classList.toggle('on',inp.value.trim().length>0&&!S.busy)}

// ===== API CALL =====
async function callAI(messages){
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages})
  });
  if(!res.ok){
    const err=await res.text().catch(()=>'');
    throw new Error('API error: '+res.status+' '+err);
  }
  return res.json();
}

// ===== SEND =====
async function send(){
  const text=inp.value.trim();if(!text||S.busy)return;
  // Hide welcome text
  if(welcome)welcome.style.display='none';
  addMsg('user',text);S.msgs.push({role:'user',content:text});
  inp.value='';inp.style.height='auto';updateSend();
  const detected=detectIntent(text);
  S.busy=true;updateSend();showTyping();
  S.orbState='thinking';
  try{
    const data=await callAI(S.msgs);
    const reply=data.choices?.[0]?.message?.content||"I couldn't respond. Please try again.";
    removeTyping();
    let{clean,action}=parseAction(reply);
    if(!action&&detected)action=detected;
    addMsg('siri',clean);S.msgs.push({role:'assistant',content:clean});
    if(action)execAction(action);
    saveHistory(text, clean);
  }catch(err){
    removeTyping();
    if(detected){addMsg('siri',"I'll take care of that! ✨");execAction(detected);}
    else{
      const errMsg=err.message||'';
      if(errMsg.includes('500')||errMsg.includes('API key')){
        addMsg('siri',"⚠️ The AI service isn't configured yet. Please add **OPENROUTER_API_KEY** as an environment variable in your Vercel project settings, then redeploy. You can get a free key at openrouter.ai");
      }else{
        addMsg('siri',"I'm having trouble connecting right now. Please check your internet connection and try again.");
      }
    }
    console.error('API error:',err);
  }finally{S.busy=false;updateSend();inp.focus();S.orbState='idle';}
}

// ===== INTENT DETECTION (no search redirect!) =====
function detectIntent(t){
  t=t.toLowerCase().trim();
  // Timer
  const tm=t.match(/(\d+)\s*(second|sec|minute|min|hour|hr)s?\s*(?:timer|countdown|focus|break)/)||t.match(/(?:timer|countdown|focus|break)\s*(?:for|of)?\s*(\d+)\s*(second|sec|minute|min|hour|hr)s?/)||t.match(/(?:set|start)\s*(?:a\s+)?(\d+)\s*(second|sec|minute|min|hour|hr)s?\s*(?:timer|focus|break|countdown)/);
  if(tm){let s=parseInt(tm[1]);const u=tm[2].toLowerCase();if(u.startsWith('min'))s*=60;else if(u.startsWith('hour')||u.startsWith('hr'))s*=3600;const l=t.includes('focus')?'Focus':t.includes('break')?'Break':'Timer';return{type:'TIMER',parts:[String(s),l]};}
  // Pomodoro
  if(t.includes('pomodoro')){const m=(t.match(/(\d+)/)||[,25])[1];return{type:'POMODORO',parts:[m]};}
  // Stopwatch
  if(t.match(/(?:start|open|show)\s*(?:a\s+)?stopwatch/))return{type:'STOPWATCH',parts:[]};
  // Calculator
  const cm=t.match(/(?:calculat|compute|what(?:'s| is)|solve)\s*[:=]?\s*(.+)/i);
  if(cm&&cm[1]){let e=cm[1].replace(/plus/gi,'+').replace(/minus/gi,'-').replace(/times|x(?=\s*\d)/gi,'*').replace(/divided by/gi,'/').replace(/[^0-9+\-*/.() ]/g,'').trim();if(e)return{type:'CALC',parts:[e]};}
  // Notes
  const nm=t.match(/(?:create|make|new|save)\s*(?:a\s+)?note\s*(?:called|titled|named)?\s*["']?([^"']+?)["']?\s*(?:with|about|:)?\s*(.*)/i);
  if(nm)return{type:'NOTE',parts:[nm[1].trim()||'Untitled',nm[2]||'']};
  // Reminders
  const rm=t.match(/(?:remind me to|reminder[:\s]+|remember to|don'?t forget to)(.+)/i);
  if(rm)return{type:'REMINDER',parts:[rm[1].trim()]};
  // Sounds
  const sm=t.match(/(?:play|start|turn on)\s*(?:some\s+)?(rain|ocean|forest|cafe|coffee|fireplace|white\s*noise|ambient)/i);
  if(sm){let s=sm[1].toLowerCase();if(s.includes('coffee')||s.includes('cafe'))s='cafe';if(s.includes('white'))s='whitenoise';return{type:'SOUND',parts:[s]};}
  if(t.match(/(?:stop|pause|turn off)\s*(?:the\s+)?(?:sound|music|ambient|noise)/))return{type:'SOUND',parts:['stop']};
  // Weather
  const wm=t.match(/(?:weather|temperature|forecast)\s*(?:in|for|at)\s+(.+)/i);
  if(wm)return{type:'WEATHER',parts:[wm[1].trim()]};
  // Time
  const ti=t.match(/(?:time|clock)\s*(?:in|at|for)\s+(.+)/i);
  if(ti){const c=ti[1].trim().toLowerCase();const m={'tokyo':'Asia/Tokyo','london':'Europe/London','new york':'America/New_York','paris':'Europe/Paris','sydney':'Australia/Sydney','dubai':'Asia/Dubai','mumbai':'Asia/Kolkata','delhi':'Asia/Kolkata','beijing':'Asia/Shanghai','singapore':'Asia/Singapore','los angeles':'America/Los_Angeles','chicago':'America/Chicago','toronto':'America/Toronto','berlin':'Europe/Berlin','seoul':'Asia/Seoul','kolkata':'Asia/Kolkata'};return{type:'TIME',parts:[m[c]||c]};}
  if(t.match(/(?:what(?:'s| is) the )?(?:current )?(?:time|date)/))return{type:'TIME',parts:['local']};
  // Open (only explicit)
  const om=t.match(/^(?:open|go to|visit|launch)\s+(.+)/i);
  if(om){let u=om[1].trim();const s={'youtube':'https://youtube.com','google':'https://google.com','twitter':'https://x.com','github':'https://github.com','reddit':'https://reddit.com','gmail':'https://mail.google.com','netflix':'https://netflix.com','spotify':'https://open.spotify.com','instagram':'https://instagram.com','chatgpt':'https://chat.openai.com'};const l=u.toLowerCase().replace(/[^a-z]/g,'');if(s[l])u=s[l];else if(!u.startsWith('http'))u='https://'+u;return{type:'OPEN',parts:[u]};}
  // NO search redirect — AI answers from its knowledge
  return null;
}

function parseAction(t){const m=t.match(/\[ACTION:(\w+):([^\]]*)\]/);if(!m)return{clean:t,action:null};return{clean:t.replace(/\[ACTION:\w+:[^\]]*\]/g,'').trim(),action:{type:m[1],parts:m[2].split('|')}}}

function execAction(a){
  const{type,parts}=a;
  switch(type){
    case'TIMER':startTimer(parseInt(parts[0])||60,parts[1]||'Timer');break;
    case'STOPWATCH':startSW();break;
    case'POMODORO':startPomo(parseInt(parts[0])||25);break;
    case'CALC':showCalc(parts[0]);break;
    case'NOTE':mkNote(parts[0]||'Untitled',parts[1]||'');break;
    case'REMINDER':mkRem(parts[0]||parts.join(' '));break;
    case'SOUND':parts[0]==='stop'?stopSound():playSound(parts[0]);break;
    case'OPEN':window.open(parts[0],'_blank');break;
    case'TIME':showTime(parts[0]||'local');break;
    case'WEATHER':showWeather(parts[0]);break;
  }
}

// ===== TIMER =====
function startTimer(secs,label){
  const id='t'+Date.now();const t={id,total:secs,rem:secs,label,run:true,done:false};S.timers.push(t);
  const circ=2*Math.PI*60;
  appendWidget(`<div class="widget" id="${id}w"><div class="widget-head"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${esc(label)}</div><div class="widget-body"><div class="wt-circle"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="7"/><circle id="${id}r" cx="70" cy="70" r="60" fill="none" stroke="var(--purple)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/></svg><div class="wt-time" id="${id}d">${fmtT(secs)}</div></div><div class="wt-label">${esc(label)}</div><div class="wt-btns" id="${id}b"><button class="wt-pause" onclick="togTimer('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause</button><button class="wt-stop" onclick="stopT('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Stop</button></div></div></div>`);
  t.iv=setInterval(()=>{if(!t.run)return;t.rem--;updTimer(t);if(t.rem<=0){clearInterval(t.iv);t.done=true;t.run=false;updTimer(t);playAlarm();if(Notification.permission==='granted')new Notification('Siri AI',{body:label+' done!'});}},1000);
}
function updTimer(t){const circ=2*Math.PI*60;const off=circ*(1-(t.rem/t.total));const r=document.getElementById(t.id+'r');if(r){r.setAttribute('stroke-dashoffset',off);if(t.done)r.setAttribute('stroke','var(--green)');}const d=document.getElementById(t.id+'d');if(d)d.textContent=t.done?'✓':fmtT(t.rem);const b=document.getElementById(t.id+'b');if(b&&t.done)b.innerHTML='<div class="wt-done">Timer Complete!</div>';else if(b)b.innerHTML=`<button class="wt-pause" onclick="togTimer('${t.id}')">${t.run?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause':'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Resume'}</button><button class="wt-stop" onclick="stopT('${t.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Stop</button>`;}
function togTimer(id){const t=S.timers.find(x=>x.id===id);if(t){t.run=!t.run;updTimer(t);}}
function stopT(id){const t=S.timers.find(x=>x.id===id);if(t)clearInterval(t.iv);S.timers=S.timers.filter(x=>x.id!==id);const el=document.getElementById(id+'w');if(el)el.remove();}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

// ===== STOPWATCH =====
function startSW(){const id='sw'+Date.now();const sw={id,el:0,run:true,laps:[],st:Date.now()};S.sw=sw;
  appendWidget(`<div class="widget" id="${id}w"><div class="widget-head"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg> Stopwatch</div><div class="widget-body" style="text-align:center"><div style="font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px" id="${id}d">00:00.00</div><div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button onclick="swLap()" style="padding:6px 14px;border-radius:14px;border:1px solid var(--border);background:var(--glass);color:var(--t2);font-size:11px;cursor:pointer;font-family:inherit">Lap</button><button onclick="swTog()" id="${id}tg" style="padding:6px 14px;border-radius:14px;border:none;background:var(--orange);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">Pause</button><button onclick="swStop()" style="padding:6px 14px;border-radius:14px;border:1px solid rgba(255,55,95,.15);background:rgba(255,55,95,.1);color:var(--pink);font-size:11px;cursor:pointer;font-family:inherit">Stop</button></div><div id="${id}l" style="margin-top:8px;max-height:90px;overflow-y:auto"></div></div></div>`);
  sw.iv=setInterval(()=>{if(!sw.run)return;sw.el=Date.now()-sw.st;const e=document.getElementById(id+'d');if(e)e.textContent=fmtSW(sw.el);},50);}
function fmtSW(ms){return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+String(Math.floor((ms%1000)/10)).padStart(2,'0');}
function swLap(){if(!S.sw)return;const e=document.getElementById(S.sw.id+'l');if(e)e.innerHTML='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);padding:2px 0;border-bottom:1px solid var(--border)">Lap '+(S.sw.laps.length+1)+'<span>'+fmtSW(S.sw.el)+'</span></div>'+e.innerHTML;S.sw.laps.push(S.sw.el);}
function swTog(){if(!S.sw)return;if(S.sw.run){S.sw.run=false;S.sw.pt=Date.now();}else{S.sw.st+=Date.now()-S.sw.pt;S.sw.run=true;}const b=document.getElementById(S.sw.id+'tg');if(b){b.textContent=S.sw.run?'Pause':'Resume';b.style.background=S.sw.run?'var(--orange)':'var(--green)';}}
function swStop(){if(!S.sw)return;clearInterval(S.sw.iv);const e=document.getElementById(S.sw.id+'w');if(e)e.remove();S.sw=null;}

// ===== POMODORO =====
function startPomo(wm){const id='p'+Date.now();const p={id,wm,rem:wm*60,run:true,phase:'work',sess:0,tot:4};S.pomo=p;
  appendWidget(`<div class="widget" id="${id}w"><div class="widget-head"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Pomodoro</div><div class="widget-body" style="text-align:center"><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--pink);margin-bottom:6px" id="${id}ph">Focus</div><div style="font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px" id="${id}d">${fmtT(p.rem)}</div><div style="display:flex;gap:4px;justify-content:center;margin-top:6px" id="${id}dots">${pomoDots(p)}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button onclick="pomoTog()" id="${id}tg" style="padding:6px 16px;border-radius:14px;border:none;background:var(--orange);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">Pause</button><button onclick="pomoStop()" style="padding:6px 16px;border-radius:14px;border:1px solid rgba(255,55,95,.15);background:rgba(255,55,95,.1);color:var(--pink);font-size:11px;cursor:pointer;font-family:inherit">Stop</button></div></div></div>`);
  p.iv=setInterval(()=>{if(!p.run)return;p.rem--;updPomo(p);if(p.rem<=0){playAlarm();if(p.phase==='work'){p.sess++;p.phase=p.sess>=p.tot?'lb':'brk';p.rem=(p.phase==='lb'?15:5)*60;}else{p.phase='work';p.rem=p.wm*60;}updPomo(p);}},1000);}

function playSound(type){stopSound();if(!S.actx)S.actx=new(window.AudioContext||window.webkitAudioContext)();const c=S.actx;const bs=c.sampleRate*4;const buf=c.createBuffer(2,bs,c.sampleRate);for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<bs;i++)d[i]=Math.random()*2-1;}const src=c.createBufferSource();src.buffer=buf;src.loop=true;const g=c.createGain();g.gain.value=0.15;const f=c.createBiquadFilter();const icons={rain:'Rain',ocean:'Ocean',forest:'Forest',cafe:'Cafe',fireplace:'Fire',whitenoise:'White'};
  if(type==='rain'){f.type='bandpass';f.frequency.value=800;f.Q.value=0.5;g.gain.value=0.2;}else if(type==='ocean'){f.type='lowpass';f.frequency.value=400;f.Q.value=1;g.gain.value=0.25;const lfo=c.createOscillator();const lg=c.createGain();lfo.frequency.value=0.08;lg.gain.value=200;lfo.connect(lg);lg.connect(f.frequency);lfo.start();S.snode={src,g,f,lfo};}else if(type==='cafe'){f.type='bandpass';f.frequency.value=1200;f.Q.value=0.3;g.gain.value=0.12;}else if(type==='fireplace'){f.type='highpass';f.frequency.value=200;f.Q.value=0.8;g.gain.value=0.18;}else if(type==='forest'){f.type='bandpass';f.frequency.value=600;f.Q.value=0.4;g.gain.value=0.1;}else{f.type='allpass';g.gain.value=0.08;}
  src.connect(f);f.connect(g);g.connect(c.destination);src.start();S.csound=type;if(!S.snode)S.snode={src,g,f};
  appendWidget(`<div class="widget"><div class="widget-head">${icons[type]||'🎵'} Ambient</div><div class="widget-body"><div class="sound-p"><div class="sound-ic">${icons[type]||'🎵'}</div><div style="flex:1"><div class="sound-n">${type[0].toUpperCase()+type.slice(1)}</div><div class="sound-s">♫ Playing</div></div><button class="sound-stop" onclick="stopSound()">Stop</button></div></div></div>`);}

let listenOrbAnim=null;
function animateListeningOrb(){
  const canvas=document.getElementById('listenOrbCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=40,H=40,cx=20,cy=20;
  let t=0;
  function draw(){
    if(!S.rec){cancelAnimationFrame(listenOrbAnim);return;}
    t+=0.05;
    ctx.clearRect(0,0,W,H);
    let audioLevel=0;
    if(S.analyser&&S.dataArray){S.analyser.getByteFrequencyData(S.dataArray);audioLevel=S.dataArray.reduce((a,b)=>a+b,0)/S.dataArray.length/255;}
    const r=14+audioLevel*6+Math.sin(t*2)*2;
    const grd=ctx.createRadialGradient(cx-r*0.2,cy-r*0.25,0,cx,cy,r);
    grd.addColorStop(0,'hsla(195,90%,75%,0.95)');
    grd.addColorStop(0.4,'hsla(275,80%,60%,0.85)');
    grd.addColorStop(0.8,'hsla(340,75%,50%,0.7)');
    grd.addColorStop(1,'hsla(210,80%,40%,0.4)');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
    // Ripples
    for(let i=0;i<2;i++){const rr=r+4+i*5+audioLevel*8;ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.strokeStyle=`rgba(191,90,242,${0.2-i*0.08+audioLevel*0.2})`;ctx.lineWidth=1.5;ctx.stroke();}
    listenOrbAnim=requestAnimationFrame(draw);
  }
  draw();
}

// ===== ENHANCED TTS (Natural Voice + Hindi Support) =====
let bestVoice=null;
let hindiVoice=null;
let allVoices=[];

function pickVoice(){
  allVoices=speechSynthesis.getVoices();
  
  // English voice preferences (Neural > Enhanced > default)
  const enPrefs=[
    'Microsoft Jenny','Microsoft Aria','Microsoft Guy','Microsoft Sara',
    'Microsoft Nancy','Microsoft Jane','Microsoft Jason','Microsoft Davis',
    'Google US English','Google UK English Female','Google UK English Male',
    'Samantha Enhanced','Samantha','Karen','Victoria','Moira','Tessa','Fiona',
    'Susan','Alex','Daniel','Fred','Serena',
    'Microsoft Zira','Microsoft Hazel',
    'Aria','Jenny','Guy','Sara','Nancy','Jane','Jason','Davis'
  ];
  for(const p of enPrefs){
    const v=allVoices.find(v=>v.name.includes(p));
    if(v){bestVoice=v;break;}
  }
  if(!bestVoice){
    const en=allVoices.filter(v=>v.lang.startsWith('en'));
    if(en.length)bestVoice=en[0];
  }
  
  // Hindi voice preferences
  const hiPrefs=[
    'Google हिन्दी','Google Hindi','Microsoft Swara','Microsoft Neerja',
    'Swara','Neerja','हिन्दी','Hindi','Aditi','Raveena'
  ];
  for(const p of hiPrefs){
    const v=allVoices.find(v=>v.name.includes(p));
    if(v){hindiVoice=v;break;}
  }
  if(!hindiVoice){
    const hi=allVoices.filter(v=>v.lang.startsWith('hi'));
    if(hi.length)hindiVoice=hi[0];
  }
}
speechSynthesis.addEventListener('voiceschanged',pickVoice);
pickVoice();

// Detect if text contains Hindi (Devanagari script)
function isHindi(text){
  // Devanagari Unicode range: \u0900-\u097F
  const hindiChars=(text.match(/[\u0900-\u097F]/g)||[]).length;
  const totalChars=text.replace(/\s/g,'').length;
  return totalChars>0&&hindiChars/totalChars>0.3;
}

// Detect language of a sentence
function detectLang(text){
  return isHindi(text)?'hi-IN':'en-US';
}

// Get best voice for a language
function getVoiceForLang(lang){
  if(lang==='hi-IN'&&hindiVoice)return hindiVoice;
  return bestVoice;
}

// Speak with natural pacing, prosody, and language detection
function speak(text){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  
  // Clean text
  const clean=text.replace(/[*#`\[\]]/g,'').replace(/\[ACTION:[^\]]*\]/g,'').replace(/\n+/g,'. ').trim();
  if(!clean)return;

  // Split into sentences (supports Hindi punctuation too)
  const sentences=clean.match(/[^.!?\u0964\u0965]+[.!?\u0964\u0965]+|[^.!?\u0964\u0965]+$/g)||[clean];
  
  let delay=0;
  sentences.forEach((sentence,i)=>{
    const s=sentence.trim();
    if(!s)return;
    
    // Detect language for this sentence
    const lang=detectLang(s);
    const voice=getVoiceForLang(lang);
    
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(s);
      if(voice)u.voice=voice;
      u.lang=lang;
      
      // Natural rate
      u.rate=lang==='hi-IN'?0.88:0.92;
      
      // Pitch variation
      if(s.endsWith('?')||s.endsWith('क्या')){
        u.pitch=1.08;u.rate*=1.02;
      }else if(s.endsWith('!')){
        u.pitch=1.05;u.rate*=1.04;
      }else{
        u.pitch=0.98;
      }
      
      u.volume=1;
      
      // Last sentence slower for closure
      if(i===sentences.length-1)u.rate*=0.9;
      
      speechSynthesis.speak(u);
    },delay);
    
    // Calculate delay
    const words=s.split(/\s+/).length;
    const punctPause=s.match(/[.!?\u0964\u0965]$/)?400:s.match(/[,]$/)?200:0;
    delay+=words*(lang==='hi-IN'?160:140)+punctPause+80;
  });
}

function spkTxt(b){speak(b.dataset.t);}
function toast(m){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--elevated);color:var(--t1);padding:10px 22px;border-radius:18px;font-size:13px;font-weight:500;z-index:999;animation:msgIn .3s;box-shadow:0 8px 32px rgba(0,0,0,.4)';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function playAlarm(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(0.3,c.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d+0.3);o.start(c.currentTime+d);o.stop(c.currentTime+d+0.3);});}catch(e){}}
function clearChat(){S.msgs=[];chat.innerHTML='';
  // Re-add welcome
  if(welcome){chat.appendChild(welcome);welcome.style.display='flex';}
  // Clear timers etc
  S.timers.forEach(t=>clearInterval(t.iv));S.timers=[];if(S.pomo){clearInterval(S.pomo.iv);S.pomo=null;}if(S.sw){clearInterval(S.sw.iv);S.sw=null;}stopSound();toast('New conversation');}
if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();
</script>
